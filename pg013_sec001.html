  <script>

      palette.forEach(function (button) {
        button.addEventListener('click', function () {
          if (document.body.dataset.linkMode === 'true') return;

        var state = { canvas: canvas, pointer: null, last: null, length: 0, pen: false, x: canvas.width / 2, y: canvas.height / 2 };
        function blocked() { return document.body.dataset.linkMode === 'true'; }

        }

          var ink = palette.find(function (button) { return button.getAttribute('aria-pressed') === 'true'; });
          ctx.strokeStyle = (ink && ink.dataset.handwritingInk) || canvas.dataset.handwritingColor || '#2563eb'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

          if (state.pen) line({ x: state.x, y: state.y }, next);
