  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: "Noto Sans Tamil", "Latha", "Nirmala UI", Arial, sans-serif;
      color: #262626;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 28px 28px;
      background: #fff;
    }

    .activity-title {
      display: inline-block;
      background: #e9a0c4;
      border-radius: 999px;
      padding: 7px 28px;
      margin-bottom: 14px;
    }

    .activity-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .instruction {
      background: #e9a0c4;
      border-radius: 12px;
      padding: 11px 18px;
      margin-bottom: 16px;
    }

    .instruction p {
      margin: 0;
      font-size: 17px;
      line-height: 1.55;
      font-weight: 500;
    }

    .photo-wrap {
      text-align: center;
      margin: 4px 0 18px;
    }

    .activity-photo {
      width: 400px;
      height: 200px;
      display: inline-block;
      object-fit: contain;
    }

    .drawing-area {
      width: 100%;
      height: 265px;
      border: 1.5px solid #333;
      background: #fff;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .drawing-area canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .teacher-note {
      background: #e9a0c4;
      border-radius: 12px;
      padding: 7px 10px;
    }

    .teacher-content {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .teacher-icon {
      width: 48px;
      min-width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      line-height: 1;
    }

    .teacher-text h3 {
      margin: 0 0 2px;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }

    .teacher-text p {
      margin: 0;
      font-size: 11px;
      line-height: 1.35;
    }

    .tts-controls {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin: 5px 0 10px;
    }

    .tts-button {
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      background: #f2c5da;
      color: #222;
      font-family: inherit;
      cursor: pointer;
      font-size: 12px;
    }

    .tts-button:hover {
      background: #e9a0c4;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 14px 20px;
      }

      .activity-title {
        padding: 6px 22px;
      }

      .activity-title h2 {
        font-size: 14px;
      }

      .instruction {
        padding: 8px 13px;
        margin-bottom: 13px;
      }

      .instruction p {
        font-size: 14px;
      }

      .activity-photo {
        width: 155px;
      }

      .drawing-area {
        height: 220px;
      }

      .teacher-icon {
        width: 40px;
        min-width: 40px;
        height: 40px;
        font-size: 25px;
      }

      .teacher-text h3 {
        font-size: 11px;
      }

      .teacher-text p {
        font-size: 8.5px;
      }
    }

    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  function position(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  canvas.addEventListener("pointerdown", function (e) {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = position(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    const p = position(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  function stopDrawing() {
    drawing = false;
    ctx.closePath();
  }

  canvas.addEventListener("pointerup", stopDrawing);
  canvas.addEventListener("pointercancel", stopDrawing);
  canvas.addEventListener("pointerleave", function () {
    if (drawing) {
      drawing = false;
      ctx.closePath();
    }
  });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
})();
</script>
